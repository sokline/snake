name: Update Version

on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.js'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cI)" >> $GITHUB_OUTPUT
          MSG=$(git log -1 --pretty=%B | head -n 1 | sed 's/"/\\"/g' | tr '\n' ' ')
          echo "message=$MSG" >> $GITHUB_OUTPUT
          
          # Читаем текущую версию или создаём новую
          if [ -f version.js ]; then
            CURRENT=$(grep -oP 'version:\s*"\K[^"]+' version.js || echo "1.0.0")
          else
            CURRENT="1.0.0"
          fi
          
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          echo "new_version=$MAJOR.$MINOR.$NEW_PATCH" >> $GITHUB_OUTPUT

      - name: Generate version.js
        run: |
          cat > version.js << EOF
          // Автообновлено GitHub Actions · $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          // Не редактируйте вручную!
          window.APP_VERSION = {
            version: "${{ steps.info.outputs.new_version }}",
            commit: "${{ steps.info.outputs.hash }}",
            date: "${{ steps.info.outputs.date }}",
            message: "${{ steps.info.outputs.message }}"
          };
          EOF
          cat version.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.js
          git commit -m "chore: bump version to ${{ steps.info.outputs.new_version }} [skip ci]" || echo "No changes"
          git push
