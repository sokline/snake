<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Змейка — SKLN 2026</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>" />
</head>
<body data-theme="dark">

  <!-- INLINE FALLBACK: работает даже если version.js не загрузился -->
  <script>
    // Версия по умолчанию — перезаписывается version.js если он загрузится
    window.APP_VERSION = window.APP_VERSION || {
      version: "1.0.0",
      commit: "local",
      date: new Date().toISOString(),
      message: "Локальная сборка"
    };
  </script>

  <section id="splash" class="splash">
    <div class="splash-inner">
      <h1 class="splash-title">ЗМЕЙКА</h1>
      <div class="splash-meta">
        <span>разработчик <b>SKLN</b></span>
        <span>2026</span>
      </div>
      <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      <div class="splash-version" id="splash-version">
        <span class="v-label">загрузка версии...</span>
      </div>
    </div>
  </section>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">🐍 Змейка</div>
      <div class="stats">
        <span>Счёт: <b id="score">0</b></span>
        <span>Рекорд: <b id="best">0</b></span>
      </div>
      <div class="menu">
        <select id="theme" title="Тема">
          <option value="dark">Тёмная</option>
          <option value="light">Светлая</option>
          <option value="green">Матрица</option>
          <option value="ocean">Океан</option>
        </select>
        <select id="profile" title="Профиль"></select>
        <button id="btn-pause" title="Пауза">⏸</button>
        <button id="btn-sound" title="Звук">🔊</button>
        <button id="btn-menu" title="Меню">⋮</button>
      </div>
    </header>

    <div class="stage">
      <canvas id="game"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <h2 id="overlay-title">Пауза</h2>
          <p id="overlay-text">Нажмите «Старт» или пробел</p>
          <div class="overlay-actions">
            <button class="btn primary" id="btn-start">▶ Старт</button>
            <button class="btn" id="btn-reset">↻ Сброс</button>
            <button class="btn" id="btn-export">⬆ Экспорт</button>
            <button class="btn" id="btn-import">⬇ Импорт</button>
            <input type="file" id="file-import" accept=".json" hidden />
          </div>
        </div>
      </div>
    </div>

    <div class="controls-bottom" id="controls-bottom"></div>

    <footer class="footer">
      <small id="footer-version">SKLN · 2026 · PWA</small>
    </footer>
  </main>

  <!-- version.js опционален — если 404, используется inline fallback -->
  <script src="version.js" onerror="console.warn('version.js не загружен, используется inline версия')"></script>
  <script src="game.js"></script>
</body>
</html>
